<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1080" viewBox="0 0 1580 1080"><rect width="1580" height="1080" fill="#f7f1e3"/><style>text{font-family:Arial,sans-serif;fill:#26392d}.title{font-size:32px;font-weight:bold}.subtitle{font-size:20px}.head{font-size:24px;fill:#f7f1e3;font-weight:bold}.row{font-size:19px}.edge{fill:none;stroke:#9a6b43;stroke-width:3}</style><text x="45" y="60" class="title">THE DAYS WE FELT ALIVE — ENTITY RELATIONSHIP DIAGRAM</text><text x="45" y="95" class="subtitle">Three tables · optional retro metadata · original release years 1990–2014</text><rect x="45" y="170" width="350" height="334" rx="9" fill="#fffdf7" stroke="#26392d" stroke-width="2"/><path d="M54 170H386Q395 170 395 179V222H45V179Q45 170 54 170" fill="#26392d"/><text x="65" y="205" class="head">USERS</text><text x="63" y="254" class="row">PK id : INT UNSIGNED</text><text x="63" y="292" class="row">name : VARCHAR(100)</text><text x="63" y="330" class="row">UQ email : VARCHAR(150)</text><text x="63" y="368" class="row">password_hash : VARCHAR(255)</text><text x="63" y="406" class="row">role : admin | customer</text><text x="63" y="444" class="row">active : BOOLEAN</text><text x="63" y="482" class="row">created_at : TIMESTAMP</text><rect x="470" y="130" width="490" height="486" rx="9" fill="#fffdf7" stroke="#26392d" stroke-width="2"/><path d="M479 130H951Q960 130 960 139V182H470V139Q470 130 479 130" fill="#26392d"/><text x="490" y="165" class="head">RENTALS</text><text x="488" y="214" class="row">PK id : INT UNSIGNED</text><text x="488" y="252" class="row">FK customer_id → users.id</text><text x="488" y="290" class="row">FK media_id → media.id</text><text x="488" y="328" class="row">request_key : CHAR(36)</text><text x="488" y="366" class="row">UQ (customer_id, request_key)</text><text x="488" y="404" class="row">rental_days : 1–30</text><text x="488" y="442" class="row">rented_on / due_on : DATE</text><text x="488" y="480" class="row">returned_on : DATE NULL</text><text x="488" y="518" class="row">daily_fee / daily_late_fee : DECIMAL</text><text x="488" y="556" class="row">rental_fee / late_fee / total : DECIMAL</text><text x="488" y="594" class="row">created_at : TIMESTAMP</text><rect x="1035" y="170" width="500" height="676" rx="9" fill="#fffdf7" stroke="#26392d" stroke-width="2"/><path d="M1044 170H1526Q1535 170 1535 179V222H1035V179Q1035 170 1044 170" fill="#26392d"/><text x="1055" y="205" class="head">MEDIA</text><text x="1053" y="254" class="row">PK id : INT UNSIGNED</text><text x="1053" y="292" class="row">title / creator : VARCHAR(150)</text><text x="1053" y="330" class="row">category : music | movie</text><text x="1053" y="368" class="row">format : CD | DVD</text><text x="1053" y="406" class="row">total_copies : INT UNSIGNED</text><text x="1053" y="444" class="row">daily_fee / daily_late_fee : DECIMAL</text><text x="1053" y="482" class="row">archived : BOOLEAN</text><text x="1053" y="520" class="row">UQ catalog_key : VARCHAR(64) NULL</text><text x="1053" y="558" class="row">original_title : VARCHAR(150) NULL</text><text x="1053" y="596" class="row">release_year : SMALLINT NULL</text><text x="1053" y="634" class="row">language : Thai | English NULL</text><text x="1053" y="672" class="row">genre : VARCHAR(100) NULL</text><text x="1053" y="710" class="row">description : VARCHAR(1000) NULL</text><text x="1053" y="748" class="row">featured_tracks : VARCHAR(500) NULL</text><text x="1053" y="786" class="row">image_url : VARCHAR(255) NULL</text><text x="1053" y="824" class="row">created_at : TIMESTAMP</text><path d="M395 265H470 M960 265H1035" class="edge"/><text x="407" y="247" class="subtitle">1</text><text x="414" y="295" class="subtitle">0..*</text><text x="974" y="295" class="subtitle">0..*</text><text x="1010" y="247" class="subtitle">1</text><text x="45" y="915" class="subtitle">Each rental belongs to exactly one customer and one media title. Users and media may have zero or many rentals.</text><text x="45" y="950" class="subtitle">Rental fees are snapshots. Available copies = total copies − active rentals. All monetary columns use DECIMAL(10,2), THB.</text><text x="45" y="985" class="subtitle">PK = primary key · FK = foreign key · UQ = unique key · Null metadata supports existing and administrator-created records.</text><text x="45" y="1030" class="subtitle">Htut Kaung San · b67103023</text></svg>