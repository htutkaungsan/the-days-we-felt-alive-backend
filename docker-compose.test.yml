name: alive-tests
services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: alive_test
      MYSQL_USER: alive
      MYSQL_PASSWORD: test-password
      MYSQL_ROOT_PASSWORD: test-root-password
    ports: ["127.0.0.1:3308:3306"]
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 5s
      retries: 30
